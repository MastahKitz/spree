name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# All runs share one real account on the live demo site (cart state lives on
# that account, not per-run) — queue runs instead of letting them race each
# other, rather than scoping the group by branch/ref.
concurrency:
  group: spree-qa-e2e
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_NAME: ${{ secrets.QA_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Fail build if any test was flaky
        run: node scripts/check-flaky.js test-report/results.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  ai-failure-triage:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-report

      - uses: actions/download-artifact@v4
        with:
          name: playwright-test-results
          path: test-results

      - name: Extract traces for inspection
        run: |
          find test-results -name 'trace.zip' | while read -r trace; do
            dir="${trace}-extracted"
            mkdir -p "$dir"
            unzip -o -q "$trace" -d "$dir"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: AI failure triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat .github/prompts/triage-failures.md)" \
            --model sonnet \
            --allowedTools "Read Grep Glob" \
            --max-budget-usd 2 \
            --output-format text \
            >> "$GITHUB_STEP_SUMMARY"
