name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# All runs share one real account on the live demo site (cart state lives on
# that account, not per-run) — queue runs instead of letting them race each
# other, rather than scoping the group by branch/ref.
concurrency:
  group: spree-qa-e2e
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_NAME: ${{ secrets.QA_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Fail build if any test was flaky
        run: node scripts/check-flaky.js test-report/results.json

      - name: Load failure analysis prompt
        if: failure()
        run: |
          {
            echo 'FAILURE_ANALYSIS_PROMPT<<PROMPT_EOF'
            cat .github/prompts/test-failure-analysis.md
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Analyze test failures
        if: failure()
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            RUN ID: ${{ github.run_id }}
            RUN URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            COMMIT: ${{ github.sha }}

            ${{ env.FAILURE_ANALYSIS_PROMPT }}

          claude_args: |
            --allowedTools "Read,Grep,Glob,Edit,Bash(git checkout:*),Bash(git config:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh pr create:*)"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14

      # Consumed by the AI failure-triage workflow, which runs in a separate
      # job (workflow_run) since Claude Code Action doesn't support the
      # `push` event this job runs on.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
