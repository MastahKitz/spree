name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# All runs share one real account on the live demo site (cart state lives on
# that account, not per-run) — queue runs instead of letting them race each
# other, rather than scoping the group by branch/ref.
concurrency:
  group: spree-qa-e2e
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_NAME: ${{ secrets.QA_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Fail build if any test was flaky
        run: node scripts/check-flaky.js test-report/results.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14
